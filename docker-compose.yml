services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      ACCOMMODATION_DB_PASSWORD: ${ACCOMMODATION_DB_PASSWORD}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - holidays-postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [holidays-network]

  accommodation-service:
    build:
      context: .
      dockerfile: Dockerfile.accommodation
    image: holidays-accommodation:1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8081
      DATABASE_URL: postgresql://holidays_accommodation:${ACCOMMODATION_DB_PASSWORD}@postgres:5432/holidays_accommodation
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [holidays-network]

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile.booking
    image: holidays-booking:1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8082
      DATABASE_URL: postgresql://holidays_booking:${BOOKING_DB_PASSWORD}@postgres:5432/holidays_booking
      ACCOMMODATION_URL: http://accommodation-service:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      accommodation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [holidays-network]

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    image: holidays-payment:1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8083
      DATABASE_URL: postgresql://holidays_payment:${PAYMENT_DB_PASSWORD}@postgres:5432/holidays_payment
      BOOKING_URL: http://booking-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8083/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [holidays-network]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: holidays-gateway:1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://holidays_gateway:${GATEWAY_DB_PASSWORD}@postgres:5432/holidays_gateway
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "false"
      ACCOMMODATION_URL: http://accommodation-service:8081
      BOOKING_URL: http://booking-service:8082
      PAYMENT_URL: http://payment-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      accommodation-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [holidays-network]

networks:
  holidays-network:
    driver: bridge

volumes:
  holidays-postgres-data:

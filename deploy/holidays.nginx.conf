server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The API Gateway serves both /api/* and the built React application.
    # Keep all Node.js service ports bound to loopback; only Nginx is public.

    location = /api {
        default_type application/json;
        return 404 '{"error":"API endpoint not found."}';
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @holidays_api_unavailable;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location @holidays_api_unavailable {
        default_type application/json;
        return 503 '{"error":"Holidays is temporarily unavailable. Please try again shortly."}';
    }
}

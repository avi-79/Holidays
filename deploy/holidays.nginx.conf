server {
    # This is the default HTTP site for the Holidays EC2 instance.
    # The deploy script disables the stock Nginx welcome-page config.
    listen 80 default_server;
    server_name _;

    root /var/www/holidays;
    index index.html;

    # Route API requests before the SPA fallback so /api/* never returns index.html.
    location = /api {
        default_type application/json;
        return 404 '{"error":"API endpoint not found."}';
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Return JSON, not Nginx's default HTML error page, when the API is down.
        proxy_intercept_errors on;
        error_page 502 503 504 = @holidays_api_unavailable;
    }

    location @holidays_api_unavailable {
        default_type application/json;
        return 503 '{"error":"Holidays API is temporarily unavailable. Please try again shortly."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

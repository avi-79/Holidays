name: Holidays CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Check service JavaScript syntax
        run: |
          node --check services/api-gateway/index.js
          node --check services/accommodation-service/index.js
          node --check services/booking-service/index.js
          node --check services/payment-service/index.js

apiVersion: apps/v1
kind: Deployment
metadata:
  name: holidays-web
  namespace: holidays
  labels:
    app: holidays-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: holidays-web
  template:
    metadata:
      labels:
        app: holidays-web
    spec:
      containers:
        - name: holidays-web
          image: ghcr.io/avi-79/holidays:1.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
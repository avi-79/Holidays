apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holidays-web
  namespace: holidays
spec:
  ingressClassName: nginx
  rules:
    - host: holidays.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holidays-web
                port:
                  number: 80